services:

  node:
    build:
      context: .
      dockerfile: dockerfile

    container_name: bienes-raices-node
    
    user: "1000:1000"

    #working_dir: /app

    volumes:
      # Tu proyecto local se refleja dentro del contenedor
      - .:/app

      # node_modules pertenece al contenedor, no al host
      - node_modules:/app/node_modules

    #command: npm run dev

    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_OPTIONS: "--trace-deprecation"

    stdin_open: true
    tty: true

volumes:
  node_modules:
